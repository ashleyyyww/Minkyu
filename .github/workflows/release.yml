name: Build

on:
  push:
    branches: [main]
    tags: ['minkyu-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check release version and notes
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Minkyu.Android/Minkyu.Android.csproj
          $version = ($project.Project.PropertyGroup.ApplicationDisplayVersion | Where-Object { $_ })
          if ($env:GITHUB_REF_NAME -ne "minkyu-$version") { throw 'Tag must match ApplicationDisplayVersion' }
          if (-not (Test-Path -LiteralPath '.github/release-notes.md') -or -not (Get-Content .github/release-notes.md -Raw).Trim()) { throw 'Write release notes before tagging' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.301'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install Android workload
        shell: pwsh
        run: |
          dotnet workload install android --skip-manifest-update
          if ($LASTEXITCODE -ne 0) { throw 'Android workload installation failed' }
      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tests | Out-Null
          dotnet run --project tests/CustomAlbums.Core.Tests -c Release -- artifacts/test-charts artifacts/tests/core.json
          if ($LASTEXITCODE -ne 0) { throw 'Parser tests failed' }
          dotnet run --project tests/CustomAlbums.MinkyuBridge.Tests -c Release -- artifacts/tests/bridge.json
          if ($LASTEXITCODE -ne 0) { throw 'Bridge tests failed' }
          dotnet run --project tests/Minkyu.Library.Tests -c Release -- artifacts/tests/library.json
          if ($LASTEXITCODE -ne 0) { throw 'Library tests failed' }
          dotnet run --project tests/Minkyu.ApkPreparation.Tests -c Release -- artifacts/tests/apk.json
          if ($LASTEXITCODE -ne 0) { throw 'APK preparation tests failed' }
          dotnet run --project tests/Minkyu.Mods.Tests -c Release -- artifacts/tests/mods.json
          if ($LASTEXITCODE -ne 0) { throw 'Mod settings tests failed' }
          dotnet build src/CustomAlbums.Cli -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Chart CLI build failed' }
          dotnet build tools/ReferenceAssemblies -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Reference utility build failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results
          path: artifacts/tests/*.json
          if-no-files-found: ignore
      - name: Fetch pinned dependencies
        run: python tools/prepare_dependencies.py
      - name: Build and verify APK
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          ./scripts/build.ps1
          python tools/verify_release.py artifacts/Minkyu-unsigned.apk
          if ($LASTEXITCODE -ne 0) { throw 'APK verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build
          path: |
            artifacts/Minkyu-unsigned.apk
            src/CustomAlbums.Android/bin/Release/net8.0/CustomAlbums.Android.dll
            src/Minkyu.Mods.Android/bin/Release/net8.0/Minkyu.Mods.Android.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: android
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-build
          path: .
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Sign release
        shell: pwsh
        env:
          MINKYU_RELEASE_KEYSTORE_BASE64: ${{ secrets.MINKYU_RELEASE_KEYSTORE_BASE64 }}
          MINKYU_RELEASE_PASSWORD: ${{ secrets.MINKYU_RELEASE_PASSWORD }}
          MINKYU_LEGACY_KEYSTORE_BASE64: ${{ secrets.MINKYU_LEGACY_KEYSTORE_BASE64 }}
        run: ./scripts/sign-release.ps1
      - name: Verify release
        shell: pwsh
        run: |
          python tools/verify_release.py
          if ($LASTEXITCODE -ne 0) { throw 'APK verification failed' }
          python tools/release_metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Build metadata failed' }
      - name: Attest release
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: artifacts/Minkyu.apk
      - name: Upload release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring("minkyu-".Length)
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME artifacts/Minkyu.apk artifacts/SHA256SUMS artifacts/build.json --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME artifacts/Minkyu.apk artifacts/SHA256SUMS artifacts/build.json --target $env:GITHUB_SHA --title "Minkyu $version" --notes-file .github/release-notes.md --draft --prerelease --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
